org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Signing and Central Portal credentials are never stored here. CI supplies them
# as ORG_GRADLE_PROJECT_* environment variables (see .github/workflows/release-sdks.yml);
# locally they are simply absent, which is what makes `publishToMavenLocal` work
# on a machine with no GPG key.
