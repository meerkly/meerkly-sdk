name: release-sdks

# ONE synced release for every SDK. The version is the Cargo workspace version
# (`Cargo.toml [workspace.package] version`) — the same number `client-core` and
# all bindings inherit. Bump the main client → all SDKs release at that version.
#
# Trigger it either way (never on an ordinary push):
#   * manually (workflow_dispatch) — publishes the current workspace version, or
#   * push a tag `v<X.Y.Z>` — must equal the workspace version (enforced below).
#
# The run is two waves, and the split is what makes "one synced release" true
# rather than merely intended:
#
#   wave 1  every `*-build` job — compile and package, touching no registry
#   wave 2  every `*-publish` job — upload, only once ALL builds have succeeded
#
# Builds run fully in parallel. Publishing waits for every one of them because
# the uploads are irreversible in different ways (crates.io only yanks, npm only
# deprecates), so a late runner failure must not leave one registry ahead of
# another at a version that can never be withdrawn.
#
# Adding an SDK therefore means two edits, not one: a `<sdk>-build` job with
# `needs: version`, and its name added to the `needs` of EVERY publish job.
#
# The publish jobs rely on the implicit rule that `needs` alone gives: a job
# runs only if every dependency succeeded. Do not add `always()` to their `if`
# without then listing every build result explicitly, or a failed build stops
# blocking the release.
#
# Node and Rust are live; the others are stubs (see the bottom). The agent
# (`meerkly` on crates.io) is NOT released from here — it is a separate product
# in meerkly/meerkly-agent with its own version.
#
# This repo is public, so every runner below is GitHub-hosted and unmetered.
# Never point a job here at the self-hosted pool: fork PRs can run code on it.
#
# Pushing a `v*` tag releases with no manual step. What guards the secrets is
# not an approval but who can start a release:
#   * the publishing secrets are environment secrets on `release`, which only
#     deploys from `v*` tags, so CI on branches and fork PRs never sees them;
#   * a tag ruleset lets only repo admins create, move or delete `v*` tags.
# `preflight` and every `*-publish` job run in that environment. A
# workflow_dispatch from a branch is therefore a dry run: the environment
# refuses the branch, so preflight fails, the builds still run, and nothing is
# published.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # Single source of truth: resolve THE version once, everything else consumes it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          CARGO_V=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_V="${GITHUB_REF_NAME#v}"
            if [ "$TAG_V" != "$CARGO_V" ]; then
              echo "::error::tag v$TAG_V does not match Cargo workspace version $CARGO_V — bump Cargo.toml first"
              exit 1
            fi
          fi
          echo "version=$CARGO_V" >> "$GITHUB_OUTPUT"
          echo "releasing all SDKs at $CARGO_V"

  # Prove we can publish before anything is published.
  #
  # node-publish and rust-publish run in parallel, and a crates.io release can
  # never be taken back — only yanked. So a missing token has to stop the release
  # up front rather than halfway through: without this, an empty
  # CARGO_REGISTRY_TOKEN lets npm publish and crates.io fail, stranding the SDKs
  # on different versions with the published half unretractable. That is exactly
  # what happened on v0.4.0.
  #
  # Checked here rather than inside each publish job so the failure arrives
  # before the build matrix has spent twenty minutes earning the right to fail.
  preflight:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: publishing tokens are present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$NPM_TOKEN" ] || missing="$missing NPM_TOKEN"
          [ -n "$CARGO_REGISTRY_TOKEN" ] || missing="$missing CARGO_REGISTRY_TOKEN"
          [ -n "$MAVEN_CENTRAL_USERNAME" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$MAVEN_CENTRAL_PASSWORD" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$MAVEN_SIGNING_KEY" ] || missing="$missing MAVEN_SIGNING_KEY"
          [ -n "$MAVEN_SIGNING_KEY_PASSWORD" ] || missing="$missing MAVEN_SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing or empty repository secret(s):$missing"
            echo "::error::set with: gh secret set <NAME> --repo ${{ github.repository }} --env release"
            echo "::error::the Maven Central ones are explained in sdk/android/README.md"
            exit 1
          fi
          echo "all publishing tokens are present"

  # ---- Node (@meerkly/sdk on npm) -------------------------------------------
  node-build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS archs build on the arm64 runner (Intel via cross-compile);
          # the Intel macos-13 runners are scarce/being retired.
          - { runner: macos-14, target: x86_64-apple-darwin }
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=optional --no-audit --no-fund
        working-directory: sdk/node
      - run: >
          npx napi build --release --platform --target ${{ matrix.target }}
          --manifest-path ../../crates/client-napi/Cargo.toml --output-dir .
        working-directory: sdk/node
      - uses: actions/upload-artifact@v4
        with:
          name: node-bindings-${{ matrix.target }}
          path: sdk/node/*.node
          if-no-files-found: error

  node-publish:
    needs: [version, preflight, node-build, rust-verify, android-build, expo-build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install --omit=optional --no-audit --no-fund
        working-directory: sdk/node
      - uses: actions/download-artifact@v4
        with:
          path: sdk/node/artifacts
          pattern: node-bindings-*
          merge-multiple: true
      - name: stamp the synced version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: sdk/node
      - name: assemble per-platform packages
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir ./artifacts --npm-dir ./npm
        working-directory: sdk/node
      # `npm publish` runs prepublishOnly (napi prepublish), which publishes the
      # per-platform packages and rewrites optionalDependencies to this version.
      # Idempotent for the same reason as the crates.io publishes: a re-run to
      # finish a half-completed release must not fail on the half that worked.
      - name: publish to npm
        run: |
          if npm view "@meerkly/sdk@${{ needs.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "@meerkly/sdk ${{ needs.version.outputs.version }} is already published; nothing to do"
          else
            npm publish --access public
          fi
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- Rust (meerkly-protocol + meerkly-sdk on crates.io) --------------------
  # Wave 1: everything that can be checked before anything is uploaded.
  #
  # Note what this can and cannot cover. `meerkly-sdk` depends on `meerkly-protocol`
  # at the release version, and on a version bump that version is not in the index
  # yet — so `cargo package -p meerkly-sdk` cannot even resolve, let alone dry-run,
  # until protocol has actually been published. Verifying the SDK before publishing
  # is therefore impossible by construction; what is left is proving the workspace
  # compiles and that protocol itself packages cleanly, which catches the failures
  # that are actually common (missing crates.io metadata, a file the package
  # excludes but the build needs).
  rust-verify:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: meerkly-protocol packages cleanly
        run: cargo publish --dry-run -p meerkly-protocol

  # Wave 2: the irreversible half. Order within it matters and is not
  # parallelisable — crates.io will not accept a crate whose dependencies are not
  # already in the index, so `meerkly-protocol` has to land, and be visible,
  # before `meerkly-sdk` can go at all.
  # `--no-verify` is deliberately NOT used: the verification build is the last
  # check that what we upload actually compiles from the packaged sources.
  rust-publish:
    needs: [version, preflight, node-build, rust-verify, android-build, expo-build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Ask the *sparse* index — the one cargo actually resolves against.
      #
      # Not `cargo search`: that queries the crates.io search index, which lags
      # the sparse index by minutes. v0.5.0 published meerkly-protocol fine and
      # then failed here having waited five minutes for a search result that had
      # simply not caught up, leaving protocol published and the SDK not.
      #
      # Sparse index paths are name-length prefixed; every crate here is 4+
      # characters, so "<first two>/<next two>/<name>" is the only case needed.
      - name: index helper
        run: |
          cat > "$RUNNER_TEMP/in-index.sh" <<'SH'
          #!/usr/bin/env bash
          # in-index.sh <crate> <version> -> exit 0 if that version is published
          set -euo pipefail
          crate="$1"; want="$2"
          url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
          body="$(curl -fsSL "$url" 2>/dev/null || true)"
          [ -n "$body" ] || exit 1
          printf '%s\n' "$body" | grep -q "\"vers\":\"${want}\""
          SH
          chmod +x "$RUNNER_TEMP/in-index.sh"

      # Both publishes are idempotent: a crates.io version can never be replaced,
      # so "already there" is success, not failure. Without this a partially
      # failed release cannot be re-run at all — the first step fails with
      # "crate version already uploaded" and the half that did not publish stays
      # unpublished, which is exactly the hole v0.5.0 fell into.
      - name: publish meerkly-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          if "$RUNNER_TEMP/in-index.sh" meerkly-protocol "$V"; then
            echo "meerkly-protocol $V is already published; nothing to do"
          else
            cargo publish -p meerkly-protocol
          fi

      # meerkly-sdk depends on meerkly-protocol at the release version, and
      # crates.io will not accept a crate whose dependencies are not in the index
      # yet. This is the wait that actually matters.
      - name: wait for the index to carry meerkly-protocol
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if "$RUNNER_TEMP/in-index.sh" meerkly-protocol "$V"; then
              echo "index has meerkly-protocol $V"; exit 0
            fi
            echo "waiting for the index ($i/30)…"; sleep 10
          done
          echo "::error::meerkly-protocol $V never appeared in the sparse index"
          exit 1

      - name: publish meerkly-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          if "$RUNNER_TEMP/in-index.sh" meerkly-sdk "$V"; then
            echo "meerkly-sdk $V is already published; nothing to do"
          else
            cargo publish -p meerkly-sdk
          fi

  # ---- Android (com.meerkly:sdk on Maven Central) ----------------------------
  # Wave 1. `scripts/build-android-sdk.sh` cross-compiles libmeerkly.so for the
  # three shipped ABIs, regenerates the Kotlin, assembles the AAR, and verifies
  # the AAR's contents. It is the same script ci.yml and a developer run, so the
  # artifact proven here is the artifact that ships.
  #
  # No emulator in this job. ci.yml already ran the instrumented load test on
  # this very commit, and booting an emulator is the flakiest thing that could
  # stand between a tag and a release.
  android-build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Its default package list includes "tools", which current cmdline-tools
      # (16.0) no longer carries, so the default install fails outright.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: cargo-ndk + NDK
        run: |
          cargo install cargo-ndk
          sdkmanager --install "ndk;28.2.13676358"
      - name: build and verify the AAR
        # The script finds the NDK under $ANDROID_HOME/ndk itself. Pinning
        # ANDROID_NDK_HOME here from ${{ env.ANDROID_SDK_ROOT }} would be worse
        # than useless: if that context value is empty the path becomes
        # /ndk/<version>, which fails the script's existence check and defeats
        # the detection that would otherwise have worked.
        run: ./scripts/build-android-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: sdk/android/lib/build/outputs/aar/*-release.aar
          if-no-files-found: error

  # Wave 2: the irreversible half. A Maven Central release cannot be withdrawn,
  # only superseded.
  #
  # The AAR is rebuilt rather than downloaded from android-build, because the
  # Gradle publish task needs the whole project — POM, sources jar, GPG
  # signatures — not just the packaged AAR. Downloading it would fetch a second
  # copy of bytes Gradle is about to produce anyway.
  #
  # Idempotent for the same reason the npm and crates.io jobs are: a re-run to
  # finish a half-completed release must not fail on the half that worked. The
  # Central Portal rejects a duplicate version as a validation error rather than
  # ignoring it, so the check has to happen before the upload. It asks the
  # portal rather than repo1.maven.org because the public repo lags a
  # publication by tens of minutes, which is exactly the window a re-run
  # happens in.
  android-publish:
    needs: [version, preflight, node-build, rust-verify, android-build, expo-build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Its default package list includes "tools", which current cmdline-tools
      # (16.0) no longer carries, so the default install fails outright.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: cargo-ndk + NDK
        run: |
          cargo install cargo-ndk
          sdkmanager --install "ndk;28.2.13676358"

      - name: is com.meerkly:sdk already published at this version?
        id: published
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          V: ${{ needs.version.outputs.version }}
        run: |
          auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" \
            | base64 | tr -d '\n')"
          body="$(curl -fsSL -H "Authorization: Bearer $auth" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=com.meerkly&name=sdk&version=$V" \
            || true)"
          # Anything other than an explicit "published: true" is treated as not
          # published: attempting the upload and being rejected is a loud, safe
          # failure, whereas skipping on an ambiguous answer would silently drop
          # Android out of a synced release.
          if printf '%s' "$body" | grep -q '"published"[[:space:]]*:[[:space:]]*true'; then
            echo "com.meerkly:sdk $V is already published; nothing to do"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: build and verify the AAR
        if: steps.published.outputs.already != 'true'
        # The script finds the NDK under $ANDROID_HOME/ndk itself. Pinning
        # ANDROID_NDK_HOME here from ${{ env.ANDROID_SDK_ROOT }} would be worse
        # than useless: if that context value is empty the path becomes
        # /ndk/<version>, which fails the script's existence check and defeats
        # the detection that would otherwise have worked.
        run: ./scripts/build-android-sdk.sh

      - name: publish to Maven Central
        if: steps.published.outputs.already != 'true'
        working-directory: sdk/android
        run: ./gradlew --console=plain --no-configuration-cache publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  # ---- Expo (@meerkly/expo on npm) -------------------------------------------
  # Wave 1. Typechecks, runs the config plugin's tests, and compiles the
  # package. The example app's Android builds are deliberately left to ci.yml:
  # they need the NDK, a prebuild and a full Gradle run, and they already ran on
  # this commit. What must not be skipped is the version check — the npm
  # package's version is what the module's Gradle uses to select its AAR, so a
  # stale one would ship a wrapper pointing at the previous release.
  expo-build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: the package version is the release version
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          npm_v=$(node -p "require('./sdk/expo/package.json').version")
          if [ "$npm_v" != "$V" ]; then
            echo "::error::sdk/expo/package.json is $npm_v but this release is $V — bump it with the workspace"
            exit 1
          fi
      - name: typecheck, test and build
        working-directory: sdk/expo
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: the published tarball has what it claims
        working-directory: sdk/expo
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for required in build/index.js build/index.d.ts plugin/build/index.js \
                          app.plugin.js expo-module.config.json android/build.gradle; do
            grep -q "$required" /tmp/pack.txt \
              || { echo "::error::$required is missing from the npm tarball"; exit 1; }
          done

  # Wave 2. Idempotent like the others: a re-run that finishes a half-completed
  # release must not fail on the half that already worked.
  expo-publish:
    needs: [version, preflight, node-build, rust-verify, android-build, expo-build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: build
        working-directory: sdk/expo
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: publish to npm
        working-directory: sdk/expo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          if npm view "@meerkly/expo@$V" version >/dev/null 2>&1; then
            echo "@meerkly/expo $V is already published; nothing to do"
          else
            npm publish --access public
          fi

  # ---- Other SDKs -----------------------------------------------------------
  # Two edits each: a `<sdk>-build` job with `needs: version`, and its name added
  # to the `needs` of every publish job above — otherwise it releases out of step
  # with the rest and the synced-version guarantee quietly stops holding.
  # Each also needs a registry + credentials + packaging before it can be enabled:
  #   python  → PyPI      : maturin/cibuildwheel per-platform wheels; secret PYPI_TOKEN
  #   ruby    → RubyGems  : platform gems wrapping the uniffi cdylib; secret RUBYGEMS_TOKEN
  #   go      → git tag   : push tag `sdk/go/v${version}` (module github.com/meerkly/meerkly-sdk/sdk/go) + a cgo native-lib story
  #   swift   → SwiftPM   : build an xcframework, host it, publish a Package.swift binaryTarget
