# Published to crates.io as `meerkly-sdk` — the Rust SDK. The directory and the
# local dependency name stay `client-core` / `meerkly-client-core` (see the
# `package = ` rename in the workspace manifest), so nothing inside this repo
# has to change to follow the published name.
[package]
name = "meerkly-sdk"
version.workspace = true
edition.workspace = true
description = "The meerkly exit-node SDK. Holds one QUIC connection to a meerkly gateway and proxies traffic out through this machine's connection."

publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/meerkly/meerkly-sdk"
homepage = "https://meerkly.com"
documentation = "https://docs.rs/meerkly-sdk"
readme = "README.md"
keywords = ["meerkly", "proxy", "quic", "bandwidth", "sdk"]
categories = ["network-programming"]
rust-version = "1.75"

[dependencies]
meerkly-protocol.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
# A fake gateway for the rejection test: a self-signed CA and a leaf for the
# dev server name, so the client's real pinned-CA handshake runs on loopback.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
